# Copy to secrets.toml locally. In Community Cloud use app Settings > Secrets.
# Never commit the real file. Keep the current app's gcp_service_account unchanged.
SETTLEMENT_MODE = "cloud"
# Accepts a 4-digit PIN or a password of 16+ characters. User enters it directly.
SETTLEMENT_PASSWORD = "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"
SETTLEMENT_DATABASE_URL = "postgresql://USER:PASSWORD@HOST:5432/postgres?sslmode=require"
